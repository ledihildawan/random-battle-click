<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Retro Battle: Console Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="./css/nes.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="app" v-cloak>
      <transition name="fade-slow">
        <splash-screen v-if="showSplash"></splash-screen>
      </transition>

      <div id="confetti-container"></div>
      <div id="snow-container"></div>

      <transition name="fade">
        <div v-if="cheatActivated" class="cheat-toast">🔓 GOD MODE ACTIVATED!</div>
      </transition>

      <div class="container" :class="{ 'shake-screen': globalShake }" v-show="!showSplash">
        <h1 class="main-title">RETRO BATTLE</h1>

        <title-screen v-if="isTitleScreen" @start="goToSelectScreen"></title-screen>

        <select-screen
          v-if="status.selecting"
          :players="players"
          :temp-selection="tempSelection"
          :focused-index="focusedCharIndex"
          @select="clickSelectPlayer"
          @confirm="confirmSelection"
          @back="backToTitle"
        ></select-screen>

        <loading-screen v-if="status.loading" :progress="loadingProgress"></loading-screen>

        <div v-if="status.play || status.winner" class="screen-battle fade-in">
          <div class="players">
            <player-card
              side="p1"
              :player="selectedPlayer.player1"
              :hp="health.player1"
              :fx="activeFx.player1"
              :active-turn="status.play && !turnInProgress && !status.winner"
              progress-theme="is-primary"
              img-class="player-1-img"
              :is-secret="selectedPlayer.player1 && selectedPlayer.player1.isSecret"
            ></player-card>

            <div class="vs-badge">VS</div>

            <player-card
              side="cpu"
              :player="selectedPlayer.player2"
              :hp="health.player2"
              :fx="activeFx.player2"
              :active-turn="status.play && turnInProgress && !status.winner"
              progress-theme="is-error"
              img-class="player-2-img"
            ></player-card>
          </div>

          <div class="nes-container with-title is-centered control-panel">
            <p class="title">Command Center</p>
            <command-center
              :winner="status.winner"
              :turn-in-progress="turnInProgress"
              :battle-menu-index="battleMenuIndex"
              :health="health"
              :limit="limit"
              :tracker="tracker"
              @attack-normal="playerAttack('normal')"
              @attack-special="playerAttack('special')"
              @heal="playerHeal"
              @new="goToSelectScreen"
              @rematch="reBattle"
              @exit="backToTitle"
              @hover-index="battleMenuIndex = $event"
            ></command-center>
          </div>

          <div class="logs-container">
            <div class="nes-container is-dark with-title">
              <p class="title">Battle Log</p>
              <logs-terminal :logs="logs"></logs-terminal>
            </div>
          </div>
        </div>
      </div>

      <give-up-dialog :open="isDialogOpen" @cancel="hideDialogGiveUp" @confirm="giveUp"></give-up-dialog>
      <div class="give-up-dialog-backdrop" v-if="status.giveUp || isDialogOpen"></div>
    </div>

    <!-- Libraries and Components -->
    <script src="./js/vue.js"></script>
    <script src="./js/services/uiEffects.js"></script>
    <script src="./js/services/battleEngine.js"></script>
    <script src="./js/components/SplashScreen.js"></script>
    <script src="./js/components/TitleScreen.js"></script>
    <script src="./js/components/SelectScreen.js"></script>
    <script src="./js/components/LoadingScreen.js"></script>
    <script src="./js/components/PlayerCard.js"></script>
    <script src="./js/components/CommandCenter.js"></script>
    <script src="./js/components/LogsTerminal.js"></script>
    <script src="./js/components/GiveUpDialog.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
