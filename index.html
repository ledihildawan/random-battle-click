<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Battle Click</title>
    <link rel="stylesheet" href="./css/nes.css" />
    <link rel="stylesheet" href="./css/perfect-scroll.css" />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="container">
        <div class="players nes-container">
          <div class="player">
            <div class="player__media center">
              <transition name="custom-2">
                <div class="player__win-counter" v-show="status.play || status.winner">{{ stats.win.player1 }}</div>
              </transition>

              <div class="visual-fx-container">
                <transition-group name="float-up" tag="div">
                  <span v-for="fx in activeFx.player1" :key="fx.id" class="floating-text" :class="fx.type"
                    >{{ fx.text }}</span
                  >
                </transition-group>
                <img
                  class="player__avatar player-1-img"
                  :class="{ 'is-dead': health.player1 <= 0 }"
                  :src="`./img/players/${selectedPlayer.player1.avatar}`"
                  alt="Player 1 Avatar"
                />
              </div>
            </div>
            <p class="player__name">{{ selectedPlayer.player1.name }}</p>

            <div class="hp-text" v-if="status.play || status.winner">{{ health.player1 }} / 100</div>

            <progress
              class="nes-progress player__health-bar"
              :value="health.player1"
              max="100"
              :class="[healthBarColorStatus(health.player1), { hidden: !status.play }, { visible: status.winner }, { 'player__health-bar--xs': status.play || status.winner }]"
            ></progress>
          </div>

          <div class="vs">VS</div>

          <div class="player">
            <div class="player__media center">
              <transition name="custom-2">
                <div class="player__win-counter" v-show="status.play || status.winner">{{ stats.win.player2 }}</div>
              </transition>

              <div class="visual-fx-container">
                <transition-group name="float-up" tag="div">
                  <span v-for="fx in activeFx.player2" :key="fx.id" class="floating-text" :class="fx.type"
                    >{{ fx.text }}</span
                  >
                </transition-group>
                <img
                  class="player__avatar player-2-img"
                  :class="{ 'is-dead': health.player2 <= 0 }"
                  :src="`./img/players/${selectedPlayer.player2.avatar}`"
                  alt="Player 2 Avatar"
                />
              </div>
            </div>
            <p class="player__name">{{ selectedPlayer.player2.name }}</p>

            <div class="hp-text" v-if="status.play || status.winner">{{ health.player2 }} / 100</div>

            <progress
              class="nes-progress player__health-bar"
              :value="health.player2"
              max="100"
              :class="[healthBarColorStatus(health.player2), { hidden: !status.play }, { visible: status.winner }, { 'player__health-bar--xs': status.play || status.winner }]"
            ></progress>
          </div>
        </div>
      </div>

      <div v-if="!status.play && !status.winner" class="mb-2 container no-background">
        <button type="button" class="nes-btn center start-game-btn" @click="startNewGame">▶ Start Game</button>
      </div>

      <div class="container">
        <div class="nes-container actions actions--alt" v-if="status.winner">
          <button type="button" class="nes-btn actions__btn" @click="exitGame">🚪 Exit</button>
          <button type="button" class="nes-btn is-primary actions__btn" @click="reBattle">⚔️ Re-Battle</button>
        </div>
      </div>

      <div class="container" v-if="status.play">
        <div class="nes-container actions">
          <div class="combat-buttons">
            <button type="button" class="nes-btn is-error actions__btn" @click="attack">Attack</button>
            <button type="button" class="nes-btn is-primary actions__btn" @click="specialAttack">Special</button>
            <button
              type="button"
              class="nes-btn is-success actions__btn"
              :class="{
                'is-disabled':
                  (health.player1 >= 100 && health.player2 >= 100) ||
                  tracker.heal >= limit.heal
              }"
              @click="heal"
              :disabled="(health.player1 >= 100 && health.player2 >= 100) || tracker.heal >= limit.heal"
            >
              Heal ({{ limit.heal - tracker.heal }})
            </button>
          </div>

          <div class="utility-buttons">
            <button
              class="actions__btn nes-btn is-warning"
              @click="showDialogGiveUp"
              type="button"
              style="margin-top: 16px"
            >
              🏳️ Give Up
            </button>
          </div>

          <dialog class="nes-dialog give-up-dialog" id="give-up-dialog">
            <form method="dialog">
              <p class="text-center">Are you sure you want to surrender?</p>
              <menu class="dialog-menu give-up-dialog-menu">
                <button class="nes-btn" @click.prevent="hideDialogGiveUp">No, fight!</button>
                <button class="nes-btn is-error" @click="giveUp">Yes, I yield</button>
              </menu>
            </form>
          </dialog>
        </div>
      </div>

      <transition name="custom-1">
        <div class="container" v-show="status.play || status.winner || (status.giveUp && logs.length)">
          <div class="logs nes-container mb-2">
            <template v-if="logs.length">
              <p v-for="(log, index) in logs" :key="index" v-html="log"></p>
            </template>
            <p v-else>Battle started! Waiting for action...</p>
          </div>
        </div>
      </transition>
    </div>

    <script src="./js/vue.js"></script>
    <script src="./js/perfect-scroll.js"></script>
    <script src="./js/script.js"></script>
  </body>
</html>
